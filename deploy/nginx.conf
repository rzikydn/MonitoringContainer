server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sama seperti rule proxy Vite (vite.config.js) untuk dev server:
    # /k8s/* -> backend Service, prefix /k8s dibuang.
    location /k8s/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Dipakai handleStreamLogs (SSE, Fitur 9 Live Log Viewer) — tanpa ini
        # nginx akan buffer seluruh response dan log stream tidak pernah "live".
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # /api dan /auth diteruskan apa adanya (prefix TIDAK dibuang), sama seperti
    # rule proxy Vite untuk keduanya.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: route lain yang bukan file statis dilempar ke index.html (React Router-less,
    # tapi tetap perlu supaya reload di path non-root tidak 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
